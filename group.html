<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⌈ 听 众 群 ⌋</title>
<style>
/* ── wired 铁律：8px 字距 · 关闭抗锯齿 · 像素锯齿保留 ── */
* {
  margin: 0;
  padding: 0;
  letter-spacing: 8px;
  image-rendering: pixelated;
  font-smooth: never;
  -webkit-font-smoothing: none;
}
body {
  background: #000;
  color: #c1b492;
  font-family: "Courier New", Courier, monospace;
  font-size: 13px;
  overflow-x: hidden;
}
#noise {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
.wrap {
  position: relative;
  z-index: 1;
  width: 800px;
  max-width: 100%;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 48px 0 40px;
  box-sizing: border-box;
}
/* 聊天室窗口 */
.chat {
  width: 640px;
  max-width: 94%;
  border: 1px solid #c82147;
  background: #000;
  box-shadow: #000 0 5px 10px;
  text-align: left;
}
.chat-head {
  background: #c82147;
  color: #000;
  font-size: 9px;
  letter-spacing: 4px;
  padding: 6px 10px;
  display: flex;
  justify-content: space-between;
}
.chat-head b { font-weight: normal; }
.chat-body {
  height: 420px;
  overflow-y: auto;
  padding: 12px 14px;
  font-size: 11px;
  letter-spacing: 1px;
  line-height: 2.1;
}
.chat-body::-webkit-scrollbar { width: 8px; background: #000; }
.chat-body::-webkit-scrollbar-thumb { background: #c82147; }
.msg { opacity: 0; animation: fadeIn 1.2s ease forwards; margin-bottom: 10px; }
.msg .who { color: #c82147; }
.msg .sys { color: #5a5a5a; letter-spacing: 2px; }
.msg .txt { color: #c1b492; letter-spacing: 2px; }
.msg .dead { color: #8a8a8a; letter-spacing: 2px; }
.chat-input {
  border-top: 1px solid #c82147;
  padding: 10px 14px;
  display: flex;
  gap: 8px;
}
.chat-input input {
  flex: 1;
  background: #000;
  color: #c1b492;
  border: 1px solid #444;
  font-family: "Courier New", Courier, monospace;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 6px 8px;
  outline: none;
}
.chat-input input:focus { border-color: #c82147; }
.chat-input button {
  background: #000;
  color: #c82147;
  border: 1px solid #c82147;
  font-family: "Courier New", Courier, monospace;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 6px 12px;
  cursor: pointer;
}
.chat-input button:hover { color: #c1b492; border-color: #c1b492; }
h1 {
  font: 20px "Times New Roman", Times, serif;
  font-weight: normal;
  color: #c1b492;
}
.intro, .tiny { font-size: 9px; }
.tiny { color: #c82147; letter-spacing: 4px; }
a { color: #c82147; text-decoration: none; }
a:hover { color: #c1b492; animation: wiredB2 1s ease-out infinite; }
hr {
  border: 0;
  border-bottom: 2px solid #c82147;
  width: 100%;
  margin: 28px 0;
}
@keyframes blink { 50% { color: #000; } }
@keyframes wiredB2 { 50% { color: #c1b492; text-shadow: #c1b492 1px 1px 6px; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.blink { animation: blink 2s linear infinite; }
#footer {
  margin-top: auto;
  padding-top: 44px;
  color: #c82147;
  font-size: 9px;
}
#footer span { background: #000; padding: 3px; }
.navline { font-size: 11px; margin-top: 24px; letter-spacing: 4px; }
</style>
</head>
<body>

<canvas id="noise"></canvas>

<div class="wrap">

  <h1>⌈ 听 众 群 ⌋</h1>
  <p class="intro" style="margin-top:12px;">LISTENER GROUP · 群号 875</p>
  <p class="tiny" style="margin-top:6px;">扫码即可加入 · 本群由晨曦FM 官方建立</p>

  <hr>

  <!-- 聊天室 -->
  <div class="chat">
    <div class="chat-head">
      <span><b>晨曦FM 87.5 听友群</b></span>
      <span id="members">成员 7 人</span>
    </div>
    <div class="chat-body" id="chat-body"></div>
    <div class="chat-input">
      <input type="text" id="input" placeholder="输入消息…" maxlength="30">
      <button id="send">发送</button>
    </div>
  </div>

  <p class="tiny" style="margin-top:14px;">群公告：本群已满员。</p>

  <div class="navline">
    <a href="index.html">← 返回晨曦FM官网</a>
  </div>

  <div id="footer">
    <span>You are invisible. <a href="#" id="go-visible">[ Go visible ]</a></span><br>
    <span style="letter-spacing:2px;" class="ls0">听众群 · 收录人数 <b id="cnt">0000333</b> · 版权所有 © 1999</span>
  </div>

</div>

<script>
(function () {
  /* ── 星空闪烁背景：Canvas 星星场，每颗星独立频率明暗呼吸，零图片素材 ── */
  var c = document.getElementById('noise');
  var ctx = c.getContext('2d');
  var stars = [];
  var STAR_COLORS = ['#d2738a', '#d2738a', '#c1b492', '#ffffff'];  // 粉·米·白，无红
  function initStars() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    stars = [];
    var n = Math.floor(c.width * c.height / 6000);  // 星点密度（稀疏夜空）
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        s: Math.random() < 0.7 ? 1 : 2,            // 偶发 2px 亮星
        color: STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0],
        base: 0.6 + Math.random() * 0.4,           // 基础亮度（更亮）
        freq: 0.5 + Math.random() * 2,             // 闪烁频率
        phase: Math.random() * Math.PI * 2         // 相位错开
      });
    }
  }
  var t0 = Date.now();
  function drawStars() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, c.width, c.height);
    var t = (Date.now() - t0) / 1000;
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * st.freq + st.phase));
      ctx.globalAlpha = st.base * tw;
      ctx.fillStyle = st.color;
      ctx.fillRect(st.x, st.y, st.s, st.s);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }
  initStars();
  drawStars();
  window.addEventListener('resize', initStars);

  /* ── 环境音：Web Audio 合成 ── */
  var AC = null, oscGain = null;
  function initAudio() {
    if (AC) return;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      var g = AC.createGain(); g.gain.value = 0.05; g.connect(AC.destination);
      var o = AC.createOscillator(); o.frequency.value = 55; o.type = 'sine'; o.connect(g); o.start();
      var buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.012;
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var ng = AC.createGain(); ng.gain.value = 0.3; src.connect(ng); ng.connect(AC.destination); src.start();
      oscGain = g;
    } catch (e) {}
  }
  document.addEventListener('pointerdown', initAudio, { once: true });
  document.addEventListener('keydown', initAudio, { once: true });

  /* ── 读取主线存档玩家名字 ── */
  var KEY = 'fm_midnight_save_v1';
  var WKEY = 'fm_wired_save';
  function mainName() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}').name || ''; } catch (e) { return ''; }
  }
  var playerName = mainName() || '神秘听众';

  /* ── 群消息剧本：逐条浮现 ── */
  var body = document.getElementById('chat-body');
  var membersEl = document.getElementById('members');
  var MSG_DELAY = 1300;

  var script = [
    { who: 'sys',   text: '欢迎来到「晨曦FM 87.5 听友群」' },
    { who: '老周',   text: '今晚的节目……你们听到了吗' },
    { who: '水仙',   text: '听到了。三点之后的那档。' },
    { who: '小舟',   text: '我昨天在楼下站了很久。广播在念我的名字。' },
    { who: '阿青',   text: '别应。应了就进来了。' },
    { who: '老周',   text: '已经进来了。群里最近又多了两个人。' },
    { who: '西碧天', text: '群里的人，你们记得几个？我记不清我是什么时候进来的了。' },
    { who: 'sys',   text: playerName + ' 已加入群聊' },
    { who: '水仙',   text: '又一个。夜莺，是你拉他进来的吗？' },
    { who: '夜莺',   text: '不是。是他自己扫的码。' },
    { who: '夜莺',   text: '欢迎。你是最后一个了。' },
    { who: 'sys',   text: '群公告已更新：本群已满员。' },
    { who: 'dead',  text: '（此后群内再无发言。窗口右下角的人头像逐个暗下去。）' }
  ];

  var idx = 0;
  function tick() {
    if (idx >= script.length) {
      body.scrollTop = body.scrollHeight;
      return;
    }
    var m = script[idx++];
    var div = document.createElement('div');
    div.className = 'msg';
    if (m.who === 'sys') {
      div.innerHTML = '<span class="sys">『' + m.text + '』</span>';
    } else if (m.who === 'dead') {
      div.innerHTML = '<span class="dead">' + m.text + '</span>';
    } else {
      div.innerHTML = '<span class="who">' + m.who + '：</span><span class="txt">' + m.text + '</span>';
    }
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    var delay = MSG_DELAY;
    if (m.who === playerName) delay = 1600;
    setTimeout(tick, delay);
  }
  setTimeout(tick, 900);

  /* 成员计数随加入增长 */
  membersEl.textContent = '成员 7 人';
  setTimeout(function () { membersEl.textContent = '成员 8 人'; }, (script.length - 2) * MSG_DELAY);
  setTimeout(function () { membersEl.textContent = '成员 8 人（满员）'; }, (script.length - 1) * MSG_DELAY);

  /* ── 发送框：回一句后，群彻底安静 ── */
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  var replied = false;
  function trySend() {
    var v = input.value.trim();
    if (!v) return;
    var div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = '<span class="who">' + playerName + '：</span><span class="txt">' + v + '</span>';
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    input.value = '';
    if (!replied) {
      replied = true;
      setTimeout(function () {
        var r = document.createElement('div');
        r.className = 'msg';
        r.innerHTML = '<span class="who">夜莺：</span><span class="txt">别发消息了。这里没有回音。</span>';
        body.appendChild(r);
        body.scrollTop = body.scrollHeight;
      }, 1800);
    }
    /* 之后群里不再有任何反应 */
    input.disabled = true;
    send.disabled = true;
    input.placeholder = '……没有回音。';
  }
  send.addEventListener('click', trySend);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') trySend(); });

  /* 真名彩蛋：输入「林晚」灯不灭，但会得到夜莺的告别 */
  input.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var v = input.value.trim();
    if ((v === '林晚' || v === 'LINWAN' || v === 'linwan') && !replied) {
      replied = true;
      setTimeout(function () {
        var r = document.createElement('div');
        r.className = 'msg';
        r.innerHTML = '<span class="who">夜莺：</span><span class="txt">……你怎么知道这个名字。……谢谢。我走了。</span>';
        body.appendChild(r);
        body.scrollTop = body.scrollHeight;
      }, 800);
    }
  });

  /* ── 访客计数仪式 ── */
  var VISKEY = 'fm_wired_visits';
  var n = 333;
  try { n = parseInt(localStorage.getItem(VISKEY) || '332', 10) + 1; localStorage.setItem(VISKEY, String(n)); } catch (e) {}
  document.getElementById('cnt').textContent = ('000000' + n).slice(-7);

  /* Go visible */
  var visible = false;
  document.getElementById('go-visible').addEventListener('click', function (e) {
    e.preventDefault();
    visible = !visible;
    this.textContent = visible ? '[ You are visible ]' : '[ Go visible ]';
    if (visible && AC && oscGain) oscGain.gain.value = 0.10;
  });
})();
</script>
</body>
</html>
