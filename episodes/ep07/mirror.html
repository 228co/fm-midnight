<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第7期 · 镜 子 - FM-MIDNIGHT</title>
<link rel="stylesheet" href="../../css/style.css?v=2.3">
<link rel="stylesheet" href="../../css/episode.css?v=4.7">
<style>
  /* 整页雾镜：雾面 canvas 盖满全屏，底下是一面反字镜子 */
  html, body { height: 100%; margin: 0; }
  body { background: #0a0908; overflow: hidden; }

  /* 镜底反字：水平镜像，像隔着玻璃从里面划出来的字 */
  .mirror-word {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    gap: 30px; transform: scaleX(-1);
    user-select: none; pointer-events: none;
  }
  .mirror-word span {
    position: relative;
    font-size: 110px; color: rgba(216,210,194,.92);
    text-shadow: 0 0 3px rgba(216,210,194,.9), 0 0 16px rgba(216,210,194,.45), 0 0 40px rgba(216,210,194,.16);
    animation: mw-breathe 6s ease-in-out infinite;
  }
  .mirror-word span:nth-child(1) { transform: rotate(-4deg) translateY(6px); animation-delay: 0s; }
  .mirror-word span:nth-child(2) { transform: rotate(2deg) translateY(-4px); animation-delay: 2s; }
  .mirror-word span:nth-child(3) { transform: rotate(-2deg) translateY(7px); animation-delay: 4s; }
  .mirror-word span::after {
    content: ''; position: absolute; left: 32%; top: 90%; width: 2px; height: 40px;
    background: linear-gradient(180deg, rgba(216,210,194,.4), rgba(216,210,194,0));
  }
  .mirror-word span:nth-child(2)::after { left: 62%; height: 26px; }
  .mirror-word span:nth-child(3)::after { left: 45%; height: 50px; }
  @keyframes mw-breathe { 0%,100% { opacity:.92; } 50% { opacity:.6; } }

  /* 雾面：盖满全屏 */
  #mirror-fog {
    position: fixed; inset: 0; z-index: 40;
    width: 100vw; height: 100vh;
    cursor: crosshair; touch-action: none;
    transition: opacity 1.4s ease;
  }

  /* 提示（雾之上） */
  .mirror-hint {
    position: fixed; top: 8vh; left: 0; right: 0; z-index: 50;
    text-align: center; color: #8a8474; font-size: 14px;
    letter-spacing: .25em; pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,.9);
  }
  .mirror-hint b { color: #c9c3b2; }

  /* 揭晓后的答题区（雾之上，初始隐藏） */
  .mirror-answer {
    position: fixed; left: 0; right: 0; bottom: 8vh; z-index: 60;
    text-align: center; color: #c9c3b2; font-size: 14px;
    letter-spacing: .2em; opacity: 0; pointer-events: none;
    transition: opacity 1s ease;
    text-shadow: 0 1px 10px rgba(0,0,0,.95);
  }
  .mirror-answer input {
    font-size: 19px; letter-spacing: .3em; text-align: center;
    padding: 10px 14px; width: 220px; background: #0d0c0a; color: #d8d2c2;
  }
  .mirror-answer button {
    font-size: 15px; letter-spacing: .3em; padding: 10px 24px; margin-left: 10px;
    border-color: #9c1f1f; color: #9c1f1f; background: #0d0c0a; cursor: pointer;
  }
  .mirror-answer .ep-gate-msg { color: #9c1f1f; }

  /* 通关结尾（初始隐藏，正常文档流） */
  #ending { display: none; padding: 40px 20px; max-width: 560px; margin: 0 auto; color: #b8b4a8; }
  #ending .ep-rune-block { margin: 30px auto; text-align: center; }
</style>
</head>
<body>

  <!-- 镜底反字（核心） -->
  <div class="mirror-word" id="mirror-word"><span>换</span><span>我</span><span>了</span></div>

  <!-- 雾面 -->
  <canvas id="mirror-fog"></canvas>

  <!-- 提示 -->
  <div class="mirror-hint" id="hint">按住鼠标，<b>擦开这面镜子</b>。雾会慢慢地、慢慢地合拢回来。</div>

  <!-- 答题区 -->
  <div class="mirror-answer" id="answer-box">
    <p>镜面上的三个字：</p>
    <input type="text" id="answer" maxlength="12" autocomplete="off" placeholder="····">
    <button id="submit">念</button>
    <p id="msg" class="ep-gate-msg"></p>
  </div>

  <!-- 通关结尾 -->
  <div id="ending">
    <p class="danger" id="done-mark">■ 本期已收听</p>
    <div class="ep-story">
      <p>你念出那三个字的时候，雾没有回来。镜子里的那个人，把脸转了过去，让出了位置。</p>
      <p>下一期，楼道里的广播会自己响起来。别关它——关不掉的，拔了插头也没用。</p>
    </div>
    <!-- 十二字集字：第七个字「语」 -->
    <div class="ep-rune-block" id="rune">
      <p class="muted small">你翻过这盘母带——背面的针尖刻字上，凝着一层水雾，像是刚被人呵过气。</p>
      <div class="ep-rune flicker">语</div>
      <p class="ep-rune-cap">十二个字里的第七个</p>
    </div>
    <p class="ep-back"><a href="../../archive.html">← 返回往期节目</a></p>
  </div>

<script src="../../js/common.js?v=2.8"></script>
<script src="../../js/episode.js"></script>
<script>
  EP.config({ id: 'ep07', title: '第7期 · 镜子 - FM-MIDNIGHT' });

  // 门禁：须先听完 B 面
  EP.require('gate2', 'index.html');

  /* ---------- 整页雾镜 ---------- */
  var fog = document.getElementById('mirror-fog');
  var ctx = fog.getContext('2d');
  var W, H;

  function resize() {
    W = fog.width = innerWidth;
    H = fog.height = innerHeight;
    paintFog();
  }
  addEventListener('resize', resize);
  resize();

  function paintFog() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#b8b4aa';
    ctx.fillRect(0, 0, W, H);
    // 噪点 + 水痕
    var img = ctx.createImageData(W, H);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = 176 + Math.random() * 30;
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  var wiped = false;
  function erase(x, y) {
    ctx.globalCompositeOperation = 'destination-out';
    var r = 54;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.6, 'rgba(0,0,0,0.85)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    wiped = true;
  }

  var erasing = false, lastX = 0, lastY = 0;
  fog.addEventListener('pointerdown', function (e) {
    erasing = true; lastX = e.clientX; lastY = e.clientY;
    erase(lastX, lastY);
  });
  addEventListener('pointermove', function (e) {
    if (!erasing) return;
    var x = e.clientX, y = e.clientY;
    var dx = x - lastX, dy = y - lastY;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var step = 12;
    for (var t = step; t < dist; t += step) {
      erase(lastX + dx * (t / dist), lastY + dy * (t / dist));
    }
    erase(x, y);
    lastX = x; lastY = y;
  });
  addEventListener('pointerup', function () { erasing = false; });

  /* ---------- 雾缓慢回拢 ---------- */
  function regrow() {
    if (revealed) return;
    ctx.globalCompositeOperation = 'source-over';
    for (var i = 0; i < 60; i++) {
      ctx.fillStyle = 'rgba(184,180,170,' + (0.04 + Math.random() * 0.08) + ')';
      var s = 60 + Math.random() * 180;
      ctx.fillRect(Math.random() * W, Math.random() * H, s, s);
    }
  }
  var regrowTimer = setInterval(regrow, 1800);

  /* ---------- 核心区是否已擦开 ---------- */
  function coreCleared() {
    var cw = W * 0.55, ch = H * 0.42;
    var x0 = W / 2 - cw / 2, y0 = H / 2 - ch / 2;
    var step = 26, total = 0, clear = 0;
    for (var x = x0; x < x0 + cw; x += step) {
      for (var y = y0; y < y0 + ch; y += step) {
        var a = ctx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data[3];
        total++;
        if (a < 40) clear++;
      }
    }
    return total ? clear / total : 0;
  }

  var revealed = false;
  var checkTimer = setInterval(function () {
    if (revealed) return;
    if (wiped && coreCleared() > 0.5) reveal();
  }, 500);

  function reveal() {
    revealed = true;
    clearInterval(regrowTimer);
    clearInterval(checkTimer);
    fog.style.opacity = '0';
    fog.style.pointerEvents = 'none';
    var hint = document.getElementById('hint');
    hint.style.transition = 'opacity .8s'; hint.style.opacity = '0';
    var box = document.getElementById('answer-box');
    box.style.opacity = '1'; box.style.pointerEvents = 'auto';
    setTimeout(function () { document.getElementById('answer').focus(); }, 300);
  }

  /* ---------- 答案校验 ---------- */
  EP.gate({
    input: '#answer',
    button: '#submit',
    msg: '#msg',
    hash: '8eec1ce50aae77b5e96da6ba37180e7c1e4fe6de4a79a5d4bd3f448d106a6226',
    flag: 'gate3',
    deny: '不对。',
    okText: '雾散了。',
    onOk: function () {
      EP.done();
      // 收起镜面，露出结尾
      var box = document.getElementById('answer-box');
      box.style.opacity = '0';
      var word = document.getElementById('mirror-word');
      word.style.transition = 'opacity 1s'; word.style.opacity = '0';
      document.body.style.overflow = 'auto';
      var ending = document.getElementById('ending');
      ending.style.display = 'block';
      var rune = document.getElementById('rune');
      rune.style.opacity = '0';
      setTimeout(function () {
        rune.style.transition = 'opacity 1.4s'; rune.style.opacity = '1';
      }, 300);
    }
  });

  // 标签页标题闪烁
  EP.titleBlink(['第7期 · 镜子', '别 背 对 镜 子'], 1800);
</script>
</body>
</html>
