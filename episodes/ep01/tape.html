<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第1期 · 磁带 - FM-MIDNIGHT</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/episode.css">
</head>
<body>

<!--
  ============================================================
  第1期《深夜点歌台》· 通关页（磁带）
  设计取舍说明（给作者）：本页是谜题2 的答案落地页，靠"改网址"
  （b-side.html → tape.html）到达，因此不再设第二层门禁——
  EP.require 只校验第一关的 gate1。玩家能到本页，说明已经解开
  Base64；再设门禁只会挡住正常流程。
  ============================================================
-->

<div class="container">

  <!-- 期头 -->
  <div class="ep-head">
    <div class="ep-no">第1期</div>
    <h1 class="ep-title glitch-text" data-text="磁带">磁带</h1>
    <p class="ep-meta">信号来源：不明 · 时长：41:00</p>
  </div>

  <!-- 通关文案（占位故事，待替换） -->
  <div class="ep-story">
    <p>（占位故事，待替换）磁带里不是歌，是 41 个人的点歌申请叠在一起。夜莺说："都收到了。"然后是一段很长的沉默。</p>
  </div>

  <hr class="ep-divider">

  <!-- 通关标记行：配合脚本里的 EP.done() 写入存档 -->
  <p class="danger">■ 本期已收听</p>

  <!--
    演示 jumpscare 组件（EP.scare）用法：点击按钮触发全屏惊吓 + 音效。
    仅为第1期示范，正式写其他期时可整段删除（按钮 + 下方对应监听）。
  -->
  <p><button id="replay">再听一遍</button></p>

  <p class="ep-back"><a href="../../archive.html">← 返回往期节目</a></p>

</div>

<script src="../../js/common.js"></script>
<script src="../../js/episode.js"></script>
<script>
  // 注册本期（与 index.html 同 id，共用 ep01 存档命名空间）
  EP.config({ id: 'ep01', title: '第1期 · 磁带 - FM-MIDNIGHT' });

  // 门禁：本页只需 gate1（设计取舍见顶部注释）
  EP.require('gate1', 'index.html');

  // 注意：EP.require 踢人时页面跳转是异步的，本脚本块仍会执行完，
  // 因此通关标记等关键逻辑放进 has 判断内，避免未过门禁的玩家被误标通关
  // （FM.debug 为调试后门：URL 带 ?debug=1 时视为已放行，便于作者自测）
  if (EP.has('gate1') || FM.debug) {

    // 标记本期通关（供 archive.html 选集页显示"已收听"）
    EP.done();

    // 雪花开场：强度 0.3（取值 0~1，越大噪点越密越亮；
    // 返回停止函数，本页开场后持续播放，不调用停止）
    EP.snow(0.3);

    // 声音激活按钮：jumpscare 音效需要用户先有过手势
    // （浏览器 AudioContext 限制，玩家点过"开启声音"后 FM.sting 才能出声）
    FM.enableSoundUI();

    // 演示 jumpscare 组件：EP.scare() 全屏黑层 + 惊吓图 + 音效（正式期可删除此监听）
    document.getElementById('replay').addEventListener('click', function () {
      EP.scare();
    });
  }
</script>
</body>
</html>
